<!DOCTYPE html>
<html lang="en">
<head>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>

    body {
      background: linear-gradient(90deg, rgb(119, 119, 171), rgb(93, 60, 60));
      display: flex;
      height: 100dvh;
      justify-content: center;
      align-items: center;
    }
    .container {
       border: 1px solid gray;
      padding: 80px 80px ;
      ;
      border-radius: 8px;
      transition: .6s ease;
      
    }
    .container:hover {
      transform: translateY(-10px) scale(1.1);
    }
    .input-groups input {
      display: flex;
    margin-bottom: 12px;
    width: 95%;
    padding: 13px  ;
    border-radius: 20px;
    border: 1px solid gray;
    background: transparent;
   
    
   
    
    
    }
    .input-groups {
      position: relative;
    }
    .input-groups input::placeholder {
      color: Azure;
       font-size: 13px;
        position: absolute;
    }
    .input-groups i {
     position: absolute;
     top: 70px;
     right: 2px 
    }
  .showpassword {
    display: flex;
    margin-bottom: 8px;
   

    
  
  }
   #checkbox {
   cursor: pointer;
   
    
   } 
   .showpassword span {
    margin-left: 55px;
    margin-top: 13px;
    margin-right: -10px;
    font-size: 13px;
    color: Azure;
    font-family: Arial;
   
  
    
   }
   
   
   .btn {
    width: 105%;
    padding: 10px;
    border-radius: 20px;
  font-weight: 700;
  margin-bottom: 8px;
  border: none;
    transition: .3s ease;
    background: transparent;
    border: 1px solid gray;
    cursor: pointer;
    
   
   } 
   .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 0 Azure,
 0 10px 15px Azure;
   }
   .btn:active {
    background: color;
   }
   
   h1 {
    text-align: center; 
    font-family: Arial;
   
   }
   .icons {
     display: flex;
     align-items: center;
     justify-content: space-around;
     margin-top: 20px;
     margin-right: 30px;
     
   
   
   }
   .showpassword p{
    margin-left: 5px;
    font-size: 13px;
    color: Azure;
    font-family: Arial;
    
   }
   .icons i {
    color: white;
    margin-left: 25px;
    cursor: pointer;
   }
   .icons span {
    font-size: 14px;
    font-family: Arial;
   }
   .input-groups .form1 {
    position: absolute;
    bottom: 156px;
    right: -1px;
    cursor: pointer;
   }
   .showpassword .hover:hover {
    text-decoration: underline;
   }
 
   
   
   
    
   
  
  



  </style>
</head>
<body>
    <div class="container">
      <h1 style="color: azure
      
      "> Login</h1>

      <div class="input-groups">

        <input type="text" id="text" placeholder="Username">
       
       <div class="form1"> <i class="fa-solid fa-user"></i></div>
        
        <input type="password" id="password" placeholder="Password">
       
         <i class="fa-solid fa-eye-slash"></i>

      </div>
      <div class="showpassword">
         <input type="checkbox" id="checkbox"> <p>Remember me</p>
          <span class="hover">Forget Password?</span> 
        </div>
        
       <button class="btn"> Login</button>


       <div class="icons">

       <i class="fa-brands fa-google"></i>
       <span>Google</span>

       <i class="fa-brands fa-facebook"></i>
        <span>Facebook</span>

       </div>
    </div>

   
          

       

</body>
</html>
