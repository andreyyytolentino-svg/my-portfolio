<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    html {
      scroll-behavior: smooth;
    }

      color: white;

    body {
   
     background: black;

    }
    .input-group .uno {
      position: absolute;
      top: 10px ;
      left: 10px;
      transition: 0.3s ;
      background: black;
     transition: 0.3s;
     font-size: 14px;
    
      
      
    }
    .input-group .dos {
      position: absolute;
      top: 53px ;
      left: 10px;
      font-size: 14px;
      background: black;
      transition: 0.3s;
      
      
      
    }
    .input-group input {
      display: flex;
      width: 100%;
      padding: 8px;
       margin-bottom: 10px;
       background: transparent;
       border: 1px solid #fff;
       border-radius: 5px;
     
     
    }
    .input-group input:focus + .uno,
    .input-group input:valid +  .uno {
      
      font-size: 10px;
      transform: translateY(-15px);
      

    }
    .input-group input:focus + .dos,
    .input-group input:valid +  .dos {

      transform: translateY(-15px);
      

    }
    .showpassword {
      display: flex;

    }
    .showpassword p {
      font-size: 13px;
    }
    .btn {
      display: block;
      width: 108%;
      margin-bottom: 20px;
      cursor: pointer;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(
    100deg,
    red,
    orange,
    yellow,
    lime,
    cyan,
    blue,
    violet,
    red
   );
      animation: rainbow 3s linear infinite;
      background-size: 300%;
    transition: .3s ease;
    

      
    }
    @keyframes rainbow {
      to {
    background-position: 0%;
  }
  from {
    background-position: 300%;
  }
}
.btn:hover {
  transform: translateZ(-5px) scale(1.1);
  
} 

.btn:active {

  background: black;
}
