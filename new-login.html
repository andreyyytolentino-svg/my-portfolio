<!DOCTYPE html>
<html lang="en">
<head>
  <style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
 
}
body {
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: arial;
 
}
.container {
 background: rgb(30, 29, 29);
  position: relative;
  overflow: hidden;
  padding: 50px;
  border-radius: 25px;
  border: 1px solid rgb(51, 50, 50);;

   
}
.container::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 90px;
  height: 90px;
  background: #201f20;
  border-bottom-left-radius: 35px;
  box-shadow: -5px 8px 20px rgba(0, 0, 0, 0.4);

  z-index: 1;
}
.container::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  background: black;

  width: 75px;
  height: 75px;
  clip-path: polygon(
    0 0,
    100% 0,
    100% 100% 

  );
 z-index: 2;

}
.close-button  {
  position: absolute;
  background-color: #252424;
  border:none;
  border-radius: 50%;
 
  left: 20px;
  top: 20px;
  padding: 8px;
  height:  30px;
  cursor: pointer;
}
.close-button i {
  color: gray;
}
.flex-input input {
  padding: 12px;
  background: #3c3c3c ;
  border: none;
  border-radius: 10px;

 
}
.flex-input {
  margin-bottom: 15px;
}
.flex-input input:hover {
  border: 1px solid rgb(158, 158, 40);
  box-shadow: inset 0 0 8px yellow;
}
.btn1 {
  display: flex;
  gap: 0;
 margin: 0 auto 35px;
  
  margin-top: 10px;
  padding: 12px;
background: #252323;
  width: 150px;
  border-radius: 15px;

 
  


 
  
}
.btn1 button {
  padding: 10px;
  margin: -5px;
  border: none;
 border-radius: 10px;
 flex: 1;
 background: transparent;
 color: #777;
  font-weight: bold;
  font-size: 11px;
  
}
.btn1 .active {
  background: #ffc21c;
  color: #111;
  box-shadow: 0 0 15px rgba(255, 194, 26, 0.4);
  padding: 8px;
  
}
.input-box {
 position: relative;
}
.input-box input {
  display: flex;
  width: 100%;
 margin-bottom: 16px;
  padding: 12px;
  background: #3c3c3c;
  border: none;
  border-radius: 10px;
  padding-left: 30px;
  color: white;
  
}
.input-box input:hover {
  border: 1px solid rgb(158, 158, 40);
  box-shadow: inset 0 0 8px yellow;
}
.input-box input::placeholder {
  position: relative;
  right: -20px;
 left: 5px;
 font-size: 12px;


}
.input-box i {
  position: absolute;
  left: 10px;
  margin-top: 10px;
  overflow: hidden;
  
  
  
}

h1 {
  text-align: center;
  color: rgb(237, 237, 47);
  font-weight: 500;
  font-size: 25px;
  margin-bottom: 30px;
}
.btn2 {
  width: 100%;
  padding: 12px;
  margin-bottom: 20px;
}
.space {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 50%px;
}
.space hr {
  flex: 1;
  border: none;
  border-top: 1px solid rgb(70, 70, 70);
  margin: 10px;
  
}
.space span {
  color: rgb(232, 232, 175);
  font-weight: bold;
  font-size: 12px;
}
.footer {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 20px;
}
.fa-envelope {
  color: gray;
}
.fa-lock {
  color: gray;
}
.btn2 {
  background: rgb(251, 251, 71);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  color: black;
  font-weight: 700;
  

}
.google-icon {
  padding: 8px 35px;
  border: none;
  border-radius: 12px;
  background: #777;
  overflow: hidden;
  z-index: 1;
  position: relative;
  
}
.google-icon::before {
  position: absolute;
  content: "";
  top: 0;
  left: -100px;
  width: 100%;
  height: 100%;
  background: rgb(65, 62, 62);

  transition: 1s ease;
  z-index: -1;
}
.google-icon:hover::before {
  left: 0px;
}


.fa-google {
 color: rgb(197, 40, 40);

  
}
.fa-facebook {
  color: blue;
}
.fa-apple {
  color: white;
}
.btn2:hover {
  transform: scale(1.1);
  transition: .3s;
}
.google-icon:hover {
  transform: translateY(-5px);
  transition: .2s;
}



    


  </style>
  <link src="stylesheet" href=""
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width= , initial-scale=1.0">
  <title>Welcome to my site</title>
</head>
<body>
  
  <section class="container">

    <button class="close-button">

      <i class="fa-solid fa-xmark"></i>




    </button>


    <div class="btn1">

      <button class="active">Sign up</button>
      <button>Login</button>

    </div>

    <h1>Create Account</h1>


      <div class="flex-input">

      <input type="text" placeholder="First Name">

          <input type="text" placeholder="Last Name">



      </div>
    


     <div class="input-box">

      <i class="fa-solid fa-envelope"></i>
      <input type="email" placeholder="Email Address">


       <i class="fa-solid fa-lock"></i>
      <input type="password" placeholder="Password">

      <i class="fa-solid fa-lock"></i>
      <input type="password" placeholder="Confirm Password">







     </div>

     <button class="btn2">Create Account</button>

     
     
     <div class="space">
      <hr>
        <span>OR</span>
     <hr>
    </div>



    <footer class="footer">

       <button class="google-icon">
      <i class="fa-brands fa-google"></i>
        </button>

        <button class="google-icon">
      <i class="fa-brands fa-facebook"></i>
        </button>


        <button class="google-icon">
      <i class="fa-brands fa-apple"></i>
        </button>

    </footer>
   



  </section>






</body>
</html>
